<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HA Views</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="rewrite-assets/app.css?v=20260915-36">
</head>
<body>
  <header class="topbar">
    <nav id="scene-tabs" class="tabs scene-tabs" aria-label="Widoki"></nav>
    <div class="top-actions">
      <select id="language-select" class="language-select" title="Language / Język" aria-label="Language / Język">
        <option value="en">EN</option>
        <option value="pl">PL</option>
      </select>
      <button id="integrations-button" class="icon-action" title="Integracje" aria-label="Integracje"><i class="mdi mdi-puzzle-outline"></i></button>
      <button id="view-manage" class="icon-action edit-only" title="Zarządzaj widokami" aria-label="Zarządzaj widokami"><i class="mdi mdi-view-dashboard-edit-outline"></i></button>
      <div id="view-switcher" class="view-switcher view-management">
        <button id="view-add" class="view-action edit-only" title="Nowy widok" aria-label="Nowy widok"><i class="mdi mdi-plus"></i></button>
        <button id="view-rename" class="view-action edit-only" title="Zmień nazwę widoku" aria-label="Zmień nazwę widoku"><i class="mdi mdi-pencil-outline"></i></button>
        <button id="view-duplicate" class="view-action edit-only" title="Duplikuj widok" aria-label="Duplikuj widok"><i class="mdi mdi-content-duplicate"></i></button>
        <button id="view-delete" class="view-action edit-only danger" title="Usuń widok" aria-label="Usuń widok"><i class="mdi mdi-delete-outline"></i></button>
      </div>
      <span id="connection" class="connection">Łączenie…</span>
      <button id="snap-toggle" class="icon-action edit-only active" title="Siatka włączona" aria-label="Siatka włączona"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 10h16M4 16h16M10 4v16M16 4v16"/></svg></button>
      <div id="background-bar" class="background-bar">
        <select id="background-select" aria-label="Wybierz tło"></select>
        <button id="background-upload" class="background-icon" title="Wgraj obraz" aria-label="Wgraj obraz"><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M5 14v5h14v-5"/></svg></button>
        <button id="background-delete" class="background-icon danger" title="Usuń tło" aria-label="Usuń tło"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v5m4-5v5"/></svg></button>
        <input id="background-file" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" hidden>
        <span id="background-status"></span>
      </div>
      <button id="background-manage" class="icon-action edit-only" title="Zarządzaj tłem" aria-label="Zarządzaj tłem"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 2-2 5 5"/></svg></button>
      <button id="edit-toggle" class="icon-action primary" title="Edytuj widok" aria-label="Edytuj widok">&#9998;</button>
    </div>
  </header>

  <main>
    <section id="view-overview" class="view active">
      <div class="scene-card">
        <div id="scene-viewport" class="scene-viewport">
          <div id="scene" class="scene">
            <img id="scene-image" alt="Tło widoku HA Views" draggable="false">
            <div id="scene-empty" class="scene-empty">
              <button id="empty-upload" class="primary">Wgraj tło widoku</button>
            </div>
            <div id="markers" class="markers"></div>
            <div id="selection" class="selection"><i data-handle="nw"></i><i data-handle="ne"></i><i data-handle="sw"></i><i data-handle="se"></i></div>
          </div>
        </div>
        <div id="panorama-indicator" class="panorama-indicator" aria-hidden="true"><i></i></div>
      </div>
    </section>

    <section id="view-integrations" class="view">
      <div class="integrations-layout">
        <article class="panel">
          <div class="panel-head"><div><h2>Dodane do widoku</h2><p>Encje widoczne na scenie</p></div><span id="added-count" class="count">0</span></div>
          <div id="added-list" class="entity-list"></div>
        </article>
        <article class="panel">
          <div class="panel-head"><div><h2>Integracje Home Assistant</h2><p>Tylko aktywne integracje widoczne w HA</p></div><button id="reload-integrations">Odśwież</button></div>
          <div id="integration-list" class="integration-list"></div>
        </article>
      </div>
    </section>
  </main>

  <aside id="editor" class="editor" aria-hidden="true">
    <div class="editor-head">
      <div id="editor-integration-icon" class="editor-integration-icon"></div>
      <div class="editor-title-block">
        <h2 id="editor-title">Marker</h2>
        <code id="editor-entity"></code>
        <div class="editor-meta"><code id="editor-integration"></code><span id="editor-status" class="editor-status"></span></div>
      </div>
      <div class="editor-quick-actions">
        <button id="default-style" class="editor-icon-button" title="Ustaw domyślny" aria-label="Ustaw domyślny"><i class="mdi mdi-restore"></i></button>
        <button id="copy-style" class="editor-icon-button" title="Kopiuj styl" aria-label="Kopiuj styl"><i class="mdi mdi-content-copy"></i></button>
        <button id="paste-style" class="editor-icon-button" title="Wklej styl" aria-label="Wklej styl"><i class="mdi mdi-content-paste"></i></button>
        <button id="remove-marker" class="editor-icon-button danger" title="Usuń z widoku" aria-label="Usuń z widoku"><i class="mdi mdi-delete-outline"></i></button>
        <button id="editor-close" class="editor-icon-button" title="Zamknij" aria-label="Zamknij"><i class="mdi mdi-close"></i></button>
        <span class="editor-version" title="Wersja aplikacji HA Views">v0.3.0-b25</span>
      </div>
    </div>
    <div class="editor-tabs">
      <button data-editor-tab="badge" class="active"><i class="mdi mdi-card-text-outline"></i><span>Badge</span></button>
      <button data-editor-tab="gauge"><i class="mdi mdi-gauge"></i><span>Gauge</span></button>
    </div>
    <div id="editor-content" class="editor-content"></div>
  </aside>

  <div id="more-info-backdrop" class="more-info-backdrop" aria-hidden="true"></div>
  <aside id="more-info" class="more-info" aria-hidden="true">
    <div class="more-info-head">
      <div id="more-info-icon" class="more-info-icon"><i class="mdi mdi-cube-outline"></i></div>
      <div><h2 id="more-info-title">Encja</h2><code id="more-info-entity"></code></div>
      <button id="more-info-close" aria-label="Zamknij"><i class="mdi mdi-close"></i></button>
    </div>
    <div class="more-info-body">
      <section class="more-info-state"><span>Aktualny stan</span><strong id="more-info-state">—</strong><small id="more-info-updated"></small></section>
      <section class="more-info-history">
        <div class="more-info-section-head"><h3>Historia</h3><div class="history-ranges"><button data-history-hours="6">6 h</button><button data-history-hours="24" class="active">24 h</button><button data-history-hours="168">7 dni</button></div></div>
        <div id="more-info-chart" class="more-info-chart"><span>Wczytywanie…</span></div>
      </section>
      <section class="more-info-attributes"><h3>Atrybuty</h3><div id="more-info-attributes"></div></section>
    </div>
  </aside>

  <div id="app-confirm" class="app-confirm" aria-hidden="true">
    <div class="app-confirm-card" role="dialog" aria-modal="true" aria-labelledby="app-confirm-title">
      <div class="app-confirm-icon"><i class="mdi mdi-alert-outline"></i></div>
      <h3 id="app-confirm-title">Potwierdzenie</h3>
      <p id="app-confirm-message"></p>
      <input id="app-confirm-input" class="app-confirm-input" type="text" maxlength="60" autocomplete="off" hidden>
      <div class="app-confirm-actions">
        <button id="app-confirm-cancel" type="button">Anuluj</button>
        <button id="app-confirm-ok" type="button">Potwierdź</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="rewrite-assets/app.js?v=20260915-36"></script>
</body>
</html>
